# Netlify builds the site from source on every push to main (and a deploy
# preview per pull request): fetch the activity list, then build.
[build]
  command = "node scripts/fetch-activities.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: client routes get index.html. Not forced, so real files in
# dist/ are still served as-is: JS, CSS, preview images, and the per-route
# pages scripts/page-meta.mjs writes (miles.html, training/chicago.html, ...)
# so link previews get each route's own title and image.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
